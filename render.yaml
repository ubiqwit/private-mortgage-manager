# One-click deploy on Render (https://render.com): New → Blueprint → pick this repo.
# Creates the web service plus a managed PostgreSQL database with daily backups.
services:
  - type: web
    name: private-mortgage-manager
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: PMM_ENV
        value: production
      - key: PMM_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mortgage-db
          property: connectionString
      # Set these two in the Render dashboard before the first deploy to create your login,
      # then you can remove them (the account stays in the database).
      - key: PMM_ADMIN_EMAIL
        sync: false
      - key: PMM_ADMIN_PASSWORD
        sync: false

databases:
  - name: mortgage-db
    plan: basic-256mb
