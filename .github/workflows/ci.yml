name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pmm
          POSTGRES_PASSWORD: pmm
          POSTGRES_DB: pmm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pmm" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests migrations
      - name: Tests (SQLite)
        run: pytest -q -W error::DeprecationWarning
      - name: Tests (PostgreSQL)
        env:
          PMM_TEST_DATABASE_URL: postgresql+psycopg://pmm:pmm@localhost:5432/pmm_test
        run: pytest -q
