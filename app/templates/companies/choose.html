{% extends "base.html" %}
{% block title %}Switch company{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Switch company</h1>
<div class="list-group" style="max-width:480px">
  {% for c in companies %}
  <form method="post" action="{{ url_for('companies.switch') }}">{{ csrf_field() }}
    <input type="hidden" name="company_id" value="{{ c.id }}">
    <button class="list-group-item list-group-item-action d-flex justify-content-between">{{ c.name }}
      {% if c.id == current_company.id %}<span class="badge text-bg-primary">current</span>{% endif %}</button>
  </form>
  {% endfor %}
</div>
{% endblock %}
