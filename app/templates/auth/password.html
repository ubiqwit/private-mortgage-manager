{% extends "base.html" %}
{% block title %}Change password — Private Mortgage Manager{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Change password</h1>
<form method="post" class="card p-4" style="max-width:420px">
  {{ csrf_field() }}
  <label class="form-label">Current password</label>
  <input type="password" name="current" class="form-control mb-3" autocomplete="current-password" required>
  <label class="form-label">New password <span class="text-secondary small">(min 10 characters)</span></label>
  <input type="password" name="new" class="form-control mb-3" minlength="10" autocomplete="new-password" required>
  <label class="form-label">Confirm new password</label>
  <input type="password" name="confirm" class="form-control mb-3" minlength="10" autocomplete="new-password" required>
  <button class="btn btn-primary">Update password</button>
  <p class="small text-secondary mt-3 mb-0">Changing your password signs you out on every other device.</p>
</form>
{% endblock %}
